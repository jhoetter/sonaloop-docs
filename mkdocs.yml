site_name: Sonaloop Docs
site_description: Documentation for Sonaloop — persona simulation, councils, and design-research synthesis over MCP.
site_url: https://jhoetter.github.io/sonaloop-docs/
repo_url: https://github.com/jhoetter/sonaloop-research
repo_name: jhoetter/sonaloop-research
edit_uri: https://github.com/jhoetter/sonaloop-docs/edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.action.edit
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Example projects: examples.md
  - Concepts:
      - Job → Framework → Format: job-framework-format.md
      - Result schemas: result-schemas.md
      - Frameworks: frameworks.md
      - Grounding: grounding.md
      - Persona creation & memory: persona-memory.md
      - Cohort Integrity: cohort-integrity.md
      - Artifact inventory: artifact-inventory.md
      - Calibration: calibration.md
      - Opt-in aggregation: opt-in-aggregation-design.md
  - The inspector:
      - The live inspector: live-inspector.md
      - Reliable job creation & continuation: reliable-runs.md
      - Web editing: web-editing.md
      - Keyboard, palette & tour: keyboard.md
      - Feedback: feedback.md
  - Operating:
      - Cloud workspaces & access: cloud-workspaces.md
      - Cloud audit & PostHog observability: cloud-observability.md
      - Product telemetry: product-telemetry.md
      - Secure remote screenshots: remote-screenshot-admission.md
      - Cloud GitHub automations: cloud-github-automations.md
      - Embeddings: embeddings.md
      - Persona catalog & pagination: catalog.md
      - Lifecycle hooks: lifecycle-hooks.md
      - Substrate: substrate.md
      - Project assets: project-assets.md
  - Live actuation:
      - Flow walkthrough: flow-walkthrough.md
      - Walkthrough safety: live-walkthrough-safety.md
      - Selective live actuation: selective-live-actuation.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - assets/responsive.css

extra_javascript:
  - assets/responsive.js
